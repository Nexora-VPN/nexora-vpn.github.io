        compatible: { type: boolean, description: This panel meets requiresPanel }
        scopes: { type: array, items: { type: object, required: [scope, purpose], properties: { scope: { type: string }, purpose: { type: string } } } }
        events: { type: array, items: { type: string } }
        docker: { type: boolean, description: The addon installs as a container }
        platforms: { type: array, items: { type: string }, description: "Platforms it ships a binary for (linux-amd64, …)" }
        options: { type: integer, description: How many questions its install asks }
        installScript: { type: boolean, description: Its repository ships install.sh }
        release:
          type: object
          nullable: true
          properties: { tag: { type: string }, publishedAt: { type: string }, url: { type: string } }
        stale: { type: boolean, description: "The directory's latest read of it failed; this is its last good manifest" }
        error: { type: string }
        signedBy: { type: string, enum: [nx, developer, development, unknown, none], description: "Who signed its manifest, as this panel sees it" }
        page: { type: string, description: The addon's page on the directory }
        registered:
          type: object
          nullable: true
          description: The addon registered here under this slug, if any
          properties:
            id: { type: integer }
            version: { type: string }
            update: { type: boolean, description: The directory lists a newer version than the one registered }
    ApiToken:
      type: object
      description: >
        A third-party API token. The plaintext `token` appears only in the
        create response; every other read omits it.
      properties:
        id: { type: integer, readOnly: true }
        token: { type: string, readOnly: true, description: "Plaintext, returned once by POST /api/tokens" }
        desc: { type: string }
        role: { $ref: "#/components/schemas/AdminRole" }
        adminId: { type: integer, description: "Operator the token acts as; 0 = a legacy unbound token acting on the whole panel" }
        owner: { type: string, readOnly: true, description: "Username of that operator" }
        scopes: { type: array, items: { type: string }, description: "Empty = unrestricted within the role" }
        addon: { type: string, description: "Addon id the token belongs to; empty for a token that is not an addon" }
        rateLimit: { type: integer, description: "Requests per minute, 0 = panel default" }
        expiry: { type: integer, format: int64, description: "Unix seconds, 0 = never" }
        lastUsedAt: { type: integer, format: int64, readOnly: true, description: "Unix seconds of the last authenticated request, 0 = never used" }
        lastUsedIp: { type: string, readOnly: true }
        createdAt: { type: integer, format: int64, readOnly: true }
        managedBy: { $ref: "#/components/schemas/AddonRef" }
    AddonData:
      type: object
      description: One addon's document on one user or admin.
      required: [addonId, data, version, updatedAt]
      properties:
        userId: { type: integer, description: "Present on a user row" }
        adminId: { type: integer, description: "Present on an admin row" }
        addonId: { type: string }
        data: { type: object, additionalProperties: true, description: "Exactly the object the addon last wrote; {} when never written" }
        version: { type: integer, description: "Number of writes so far; 0 when never written. Send it back on PUT for a conditional write." }
        updatedAt: { type: integer, format: int64, description: "Unix seconds of the last write, 0 when never written" }
    AddonDataRequest:
      type: object
      required: [data]
      properties:
        data: { type: object, additionalProperties: true, description: "The whole document; at most 16 KiB" }
        version: { type: integer, description: "The version last read. Absent = unconditional write." }
    BackupManifest:
      type: object
      description: The archive's own account of itself, written as its first entry.
      properties:
        format: { type: integer, description: "Archive layout version; a panel refuses anything newer than it understands" }
        panel_version: { type: string, description: "The build that wrote it" }
        driver: { type: string, enum: [sqlite, postgres] }
        hwid: { type: string, description: "The source host's fingerprint. The licence is locked to it, so an archive restored elsewhere comes up unlicensed." }
        web_domain: { type: string }
        basepath: { type: string }
        created_at: { type: integer, format: int64, description: "Unix seconds" }
        encrypted: { type: boolean }
        contents:
          type: object
          properties:
            history: { type: boolean }
            audit: { type: boolean }
        tables: { type: array, items: { $ref: "#/components/schemas/BackupTable" } }
        skipped:
          type: object
          additionalProperties: { type: string }
          description: "Table name → why it was left out (transient, excluded, or absent from the source schema)"
    BackupTable:
      type: object
      properties:
        name: { type: string }
        rows: { type: integer, format: int64 }
    BackupWarning:
      type: object
      description: >
        One advisory about restoring this archive here. Each is a decision for
        the operator, except the four a restore enforces:
        `version_mismatch`, `no_admins`, `unusable_ingress` and
        `unusable_kept_address`.
      properties:
        code:
          type: string
          enum: [version_mismatch, no_admins, unusable_ingress, unusable_kept_address, ingress_unchecked, hwid_mismatch, mtls_changed, node_pin_changed, ingress_settled, different_panel, no_history, no_audit]
          description: >
            `version_mismatch` — written by another panel version than this
            one (the archive's in `detail`), older or newer: a restore refuses
            it with 400 `version_mismatch`.
            `no_admins` — the archive holds no main-admin (sudo) account. This
            is one of the advisories a restore also enforces (400 `no_admins`), and
            the preview applies the same test so the two cannot disagree.
            `unusable_ingress` — restored with its own addresses (this
            install's not kept, as the setup wizard restores), the archive is
            refused with 400 `unusable_ingress`: why is in `detail`.
            `unusable_kept_address` — the same refusal when this install's
            address is kept (`keep_web_settings`, the default). Both come from
            running the restore's own address checks over the archive's rows,
            so a preview and a restore cannot disagree.
            `ingress_unchecked` — the archive holds more rows (over 50,000) or
            bytes (over 64 MiB) of the tables the address check reads than a
            preview keeps in memory, so the preview did not check its
            addresses; the restore still checks them and may refuse with 400
            `unusable_ingress`.
            `ingress_settled` — what the restore changes in the addresses it
            stages so they serve, in `detail`: a listener whose certificate the
            archive lacks switched off, a route admitting only deleted tokens
            or bound to an account the archive lacks answering 404 (prefixed
            "keeping this install's address:" for the kept address).
            `hwid_mismatch` — a different host fingerprint: the licence
            travelling inside will not validate here.
            `mtls_changed` — the archive holds a different panel mTLS client
            certificate, which is the CA every node was installed to trust:
            restoring it makes every node refuse this panel until each is
            reinstalled.
            `node_pin_changed` — the archive's pinned server certificate for
            one or more nodes (named in `detail`) differs from the live one, so
            those nodes' control APIs would be refused until they are repinned.
            `different_panel` — a different web domain, the visible sign of an
            archive from another install.
            `no_history` / `no_audit` — the optional groups were excluded, so a
            restore empties the usage graphs / the audit log.
        detail: { type: string, description: "The specifics the message needs (a version, a fingerprint, a hostname)" }
    BackupPreview:
      type: object
      properties:
        manifest: { $ref: "#/components/schemas/BackupManifest" }
        encrypted: { type: boolean, description: "Whether the archive was passphrase-protected. Only ever seen after a successful decrypt — an archive that could not be opened answers 400 with code `encrypted` or `passphrase` instead, which is the signal a UI keys a passphrase prompt off." }
        tables: { type: array, items: { $ref: "#/components/schemas/BackupTable" }, description: "What was actually found, verified against the manifest" }
        warnings: { type: array, items: { $ref: "#/components/schemas/BackupWarning" }, description: "Most consequential first" }
        size: { type: integer, format: int64, description: "The uploaded archive's size in bytes" }
    BackupRestore:
      type: object
      description: >
        What a restore loaded. `staged` says whether it is still waiting for
        the restart (SQLite: the live database is untouched until the file
        swap) or already committed (PostgreSQL: the restart only reloads what
        the process holds in memory).
      properties:
        manifest: { $ref: "#/components/schemas/BackupManifest" }
        tables: { type: integer, description: "Tables loaded" }
        rows: { type: integer, format: int64, description: "Rows loaded" }
        snapshot: { type: string, description: "Path on the panel host of the full backup taken of the database being replaced" }
        staged: { type: boolean, description: "True on SQLite: the replacement is a separate file and the live database is still untouched until the restart. False on PostgreSQL, where the transaction has already committed and the restart only reloads in-memory state." }
        kept:
          type: array
          items: { type: string }
          description: "Settings this installation held on to instead of taking the archive's"
        skipped_tables:
          type: array
          items: { type: string }
          description: "Tables in the archive this schema no longer has"
        dropped_columns:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: "Table → columns the archive carried that this schema does not. This is how an archive from another version loads at all."
        restarting: { type: boolean }
    BackupFile:
      type: object
      description: One archive in the panel host's backup directory.
      properties:
        name: { type: string, description: "File name; the identifier every other route on this collection takes" }
        size: { type: integer, format: int64 }
        created_at: { type: integer, format: int64, description: "Unix seconds, read from the timestamp in the file name — not the modification time, which changes when the directory is copied, and not the manifest, which an encrypted archive does not show. Every route reports the same value for the same file." }
        encrypted: { type: boolean }
        kind:
          type: string
          enum: [backup, pre-restore]
          description: >
            `backup` is a scheduled or manually taken backup. `pre-restore` is
            the safety copy taken of a database that was about to be replaced —
            retention never deletes one, and it does not count as evidence that
            the panel has been backed up.
        manifest: { $ref: "#/components/schemas/BackupManifest" }
    BackupList:
      type: object
      properties:
        dir: { type: string, description: "Where the archives live on the panel host" }
        files: { type: array, items: { $ref: "#/components/schemas/BackupFile" }, description: "Newest first" }
        total: { type: integer }
        bytes: { type: integer, format: int64, description: "Total size of the directory's archives" }
        schedule: { $ref: "#/components/schemas/BackupSchedule" }
    BackupSchedule:
      type: object
      properties:
        enabled: { type: boolean }
        intervalHours: { type: integer, description: "How often to take one; the hourly scheduler decides due-ness from the newest archive on disk" }
        dir: { type: string }
        keep: { type: integer, description: "How many backups to keep; 0 keeps everything. Pre-restore snapshots are never pruned." }
        includeHistory: { type: boolean }
        includeAudit: { type: boolean }
        passphraseSet: { type: boolean, readOnly: true, description: "Whether scheduled archives are encrypted. The passphrase itself is never returned." }
        nextDue: { type: integer, format: int64, readOnly: true, description: "Unix seconds, 0 when the schedule is off or there is no archive the timer counts — pre-restore snapshots and archives stamped more than an hour ahead of now are not counted, exactly as the scheduler does not count them" }
    BackupScheduleUpdate:
      type: object
      description: >
        A partial update: every field is optional, and one that is absent (or
        null) leaves the stored value alone. That is the only safe reading of
        an all-optional object — a client sending just the field it means to
        change must not have the schedule switched off and the directory moved
        underneath it — and it is how the write-only passphrase has always
        behaved. Sending the whole object, as the panel's own form does,
        replaces the whole schedule.
      properties:
        enabled: { type: boolean, nullable: true }
        intervalHours: { type: integer, minimum: 0, maximum: 8760, nullable: true, description: "0 takes the default (24h): enabled with no interval is a half-filled form, not a request for nothing. Capped at a year. Null or absent leaves the stored value alone — a cleared number box must not silently rewrite the schedule." }
        dir: { type: string, nullable: true, description: "Absolute path, or empty for the default beside the database. A relative path is refused: it would resolve against the panel process's working directory. Null or absent leaves the stored directory alone." }
        keep: { type: integer, minimum: 0, nullable: true, description: "0 keeps everything, and is stored as 0 — not as the default. Null or absent leaves the stored value alone, which is how a cleared box differs from a deliberate 0." }
        includeHistory: { type: boolean, nullable: true }
        includeAudit: { type: boolean, nullable: true }
        passphrase: { type: string, writeOnly: true, description: "Empty leaves the stored one alone" }
        clearPassphrase: { type: boolean, writeOnly: true, description: "Removes the stored passphrase, so scheduled archives stop being encrypted" }
    BackupError:
      type: object
      properties:
        error: { type: string }
        code: { type: string, enum: [encrypted, passphrase, format, too_large, confirm, busy, version_mismatch, no_admins, unusable_ingress, unsupported] }
    Change:
      type: object
      description: >
        One audit record: a mutating admin or API-token action, the operator that
        performed it, and the payload it carried.
      properties:
        id: { type: integer, format: int64, readOnly: true }
        dateTime: { type: integer, format: int64, readOnly: true, description: "Unix seconds" }
        actor: { type: string, readOnly: true, description: "Operator username, or \"system\" for an unattended action" }
        key: { type: string, readOnly: true, description: "Entity type: user, inbound, outbound, endpoint, node, template, certificate, panel_certificate, admin, token, license, panel, changes" }
        action: { type: string, readOnly: true, description: "create | update | delete, plus per-entity verbs (issue, renew, purge, restart, …)" }
        obj: { description: "The action's payload, with secret-looking fields replaced by \"[redacted]\"" }
    IPBan:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        prefix: { type: string, description: "An IP address or a CIDR" }
        reason: { type: string }
        source: { type: string, enum: [auto, manual], readOnly: true }
        createdBy: { type: string, readOnly: true, description: "The admin, or `system` for an automatic ban" }
        createdAt: { type: integer, format: int64, readOnly: true }
        expiresAt: { type: integer, format: int64, readOnly: true, description: "Unix seconds; 0 = permanent" }
    InstallToken:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          properties:
            pin: { type: string, description: "curl's --pinnedpubkey form, sha256//<base64 SPKI digest>; absent when curl can verify the panel without it" }
    Token:
      type: object
      description: Node-install token (see ApiToken for third-party API tokens).
      properties:
        id: { type: integer, readOnly: true }
        kind: { type: string, enum: [node_install, api] }
        token: { type: string }
        desc: { type: string }
        role: { $ref: "#/components/schemas/AdminRole" }
        scopes: { type: string }
        usedAt: { type: integer, format: int64, nullable: true }
        expiry: { type: integer, format: int64 }
        createdAt: { type: integer, format: int64, readOnly: true }
    Endpoint:
      type: object
      properties:
        id: { type: integer, readOnly: true }
        tag: { type: string }
        type: { type: string, description: "wireguard, tailscale, openvpn-server, openconnect-server, ..." }
        config: { $ref: "#/components/schemas/JSON" }
        useNodeCert: { type: boolean, description: "Replace a server endpoint's (openvpn/openconnect-server) TLS cert with the node's managed cert" }
        certificateId: { type: integer, nullable: true, description: "Panel certificate assigned to this endpoint's TLS (wins over useNodeCert)" }
        createdAt: { type: integer, format: int64, readOnly: true }
        updatedAt: { type: integer, format: int64, readOnly: true }
    PresetItem:
      type: object
      properties:
        tag: { type: string, description: "The tag the rule set would be created under, which is also half its download URL." }
        url: { type: string, description: "Where the panel fetches the list from." }
        label: { type: string, description: "Shown as written. An operator's own entry carries this." }
        labelKey: { type: string, description: "An i18n key the interface resolves. A built-in entry carries this." }
    PresetRoute:
      type: object
      description: >
        A routing block an operator can apply to a template. `requires` is the
        load-bearing field: the panel leaves out a rule set it holds no copy of
        **and every rule matching on it** — it must, since the core refuses a
        router whose rule names an undefined rule-set — so a preset applied
        without its lists is a template that does nothing and reports nothing.
        Naming the tags lets a client check them first and offer to create the
        missing ones off the rule-set shelf in this same document, which is why
        both shelves live in one catalogue.
      properties:
        key: { type: string }
        label: { type: string }
        labelKey: { type: string }
        description: { type: string }
        descriptionKey: { type: string }
        requires:
          type: array
          items: { type: string }
          description: "Rule-set tags the rules match on. Every one of them is also an entry on the rule-set shelf, so a client can create what is missing."
        route: { type: object, additionalProperties: true, description: "A route object (rules + final). `direct` is the only outbound every node has." }
        compose:
          type: boolean
          description: "True for a preset whose rules are put **in front of** the template's rules rather than replacing them. The country presets replace, because rule order is the routing; a self-contained preset (sniff, then reject a sniffed protocol) has to run first, and first is an order."
        outbounds:
          type: array
          description: "Pool outbounds the route names. A client creates any the panel lacks (by tag) and selects them on the template — the block-torrent preset routes to a `block` outbound because a rejection through an outbound is the only kind the node counts."
          items:
            type: object
            properties:
              tag: { type: string }
              type: { type: string }
              config: { type: object, additionalProperties: true }
    PresetDns:
      type: object
      description: "A set of resolvers and which one answers by default, as a typed `dns` block ready to drop into a template's core. The older `address` form is not used: a node running the current core refuses a config carrying it."
      properties:
        key: { type: string }
        label: { type: string }
        labelKey: { type: string }
        description: { type: string }
        descriptionKey: { type: string }
        dns: { type: object, additionalProperties: true }
    PresetInbound:
      type: object
      description: >
        One "make me this kind of inbound". It carries the decisions and never
        the per-install randomness: no port, no key, no path. The port and the
        generated secrets come from the interface's own defaults for the type,
        the transport path is generated (one frozen into the document would be
        identical on every install, which is a fingerprint), and the REALITY
        private key and short IDs are minted by the panel when the inbound is
        saved — which is why an operator never types a key. What it produces is
        an ordinary inbound row; nothing records which preset made it.
      properties:
        key: { type: string, description: "Its identity, and what an overlay file matches on to replace it." }
        label: { type: string }
        labelKey: { type: string }
        description: { type: string }
        descriptionKey: { type: string }
        type: { type: string, description: "The inbound type." }
        tag: { type: string, description: "The base the created inbound's tag is built from; a short random suffix is appended. Absent = the type." }
        transport: { type: string, description: "A stream transport (ws, grpc, httpupgrade, …), applied the way the form applies one an operator picked." }
        useNodeCert: { type: boolean, description: "Point the inbound at the node's managed certificate. Needed wherever the preset turns TLS on for a protocol that does not require it." }
        config: { type: object, additionalProperties: true, description: "Merged over the interface's default config for `type`." }
        clientConfig: { type: object, additionalProperties: true, description: "Client-side hints merged into generated links." }
    PresetGroup:
      type: object
      properties:
        key: { type: string, description: "The group's identity, and what an overlay file matches on to replace it." }
        label: { type: string }
        labelKey: { type: string }
        items: { type: array, items: { $ref: "#/components/schemas/PresetItem" } }
    PresetCatalogue:
      type: object
      properties:
        version: { type: integer, description: "The document's shape. 1 today; later sessions add sections rather than changing these." }
        ruleSets:
          type: object
          properties:
            countries:
              type: array
              description: "One group per country. Domains and IP ranges are two entries, not one — a rule matching only domains misses a client that dialled an address."
              items: { $ref: "#/components/schemas/PresetGroup" }
            services: { type: array, items: { $ref: "#/components/schemas/PresetItem" } }
        inbounds:
          type: array
          description: "The shelf behind “add an inbound from a preset”: a protocol with its transport and TLS decision already made."
          items: { $ref: "#/components/schemas/PresetInbound" }
        routes:
          type: array
          description: "Routing blocks for a template, composed of rule sets the panel already mirrors."
          items: { $ref: "#/components/schemas/PresetRoute" }
        dns:
          type: array
          description: "Resolver sets for a template's core, in the typed server form."
          items: { $ref: "#/components/schemas/PresetDns" }
        sources:
          type: array
          items: { type: string }
          description: "The operator catalogue files that were read, in the order they were applied. Always present; empty means the panel is serving only what it ships."

    RuleSet:
      type: object
      description: >
        A remote rule set the panel mirrors. The panel downloads the
        list from `url`, keeps a copy, refreshes it every `updateIntervalHours`,
        and pushes that copy to each node over its control link — nodes never
        fetch anything. A node whose first rule-set fetch fails refuses its whole
        configuration, so nobody's availability must be able to decide whether
        the fleet runs. A node too old to take the push (before node v0.0.2) is
        given no rule sets, and no rule naming one.


        Templates select rule sets the way they select pool items, and the
        selection becomes each node's `route.rule_set[]`. Only the remote kind
        exists: a local rule-set names a file the panel does not put on the node,
        and an inline one is a rule list, which `route.rules` already is.
      properties:
        id: { type: integer, readOnly: true }
        tag:
          type: string
          description: >
            The name a rule matches on. Letters, digits, '-', '_' and '.' only,
            because it also names the file on each node. Fixed after creation.
        url: { type: string, description: "Absolute http(s) upstream the panel downloads from. Never sent to a node." }
        updateIntervalHours: { type: integer, description: "How often the panel re-downloads from upstream. A refresh that changed the bytes pushes them to the nodes carrying the list." }
        format: { type: string, enum: [binary, source], readOnly: true, description: "Detected from the downloaded bytes, never chosen" }
        available: { type: boolean, readOnly: true, description: "The panel holds a copy. An unavailable rule set, and every rule naming it, is left out of node configurations." }
        size: { type: integer, format: int64, readOnly: true }
        ruleCount: { type: integer, readOnly: true }
        contentHash: { type: string, readOnly: true, description: "sha256 of the mirrored bytes; a node already holding them is not pushed them again" }
        lastFetchedAt: { type: integer, format: int64, readOnly: true, description: "Unix seconds; 0 = never downloaded" }
        lastAttemptAt: { type: integer, format: int64, readOnly: true }
        lastError: { type: string, readOnly: true, description: "Why the last refresh did not land. The previous copy is kept." }
        createdAt: { type: integer, format: int64, readOnly: true }
        updatedAt: { type: integer, format: int64, readOnly: true }
    RouteTestForm:
      type: object
      required: [inbounds]
      properties:
        inbounds:
          type: array
          items:
            type: object
            required: [tag]
            properties:
              tag: { type: string }
              type: { type: string, description: "The panel's type for the tag; absent when the panel has no record of it" }
              remark: { type: string, description: "The inbound's remark, or the tunnel's name" }
    RouteTestRequest:
      type: object
      required: [inbound, address, port]
      properties:
        inbound: { type: string, description: The inbound's tag on the node }
        user: { type: string, description: "The user's name; empty for a connection that carries none" }
        network: { type: string, enum: [tcp, udp], description: "Default tcp" }
        source: { type: string, description: "The client's address, an IP with or without a port; optional" }
        address: { type: string, description: The destination as the client asked, an IP or a domain }
        port: { type: integer, minimum: 1, maximum: 65535 }
        domain: { type: string, description: "The sniffed domain (TLS SNI, HTTP Host); optional" }
        protocol: { type: string, description: "The sniffed protocol (tls, http, quic, bittorrent, …); optional" }
    RouteTestStep:
      type: object
      required: [index, rule, action, matched]
      properties:
        index: { type: integer }
        rule: { type: string, description: "The rule in the engine's own words — what a live connection's row shows for it" }
        action: { type: string }
        matched: { type: boolean }
        final: { type: boolean, description: This rule ended the walk }
        skipped: { type: string, enum: [sniff, resolve], description: "A matched action the dry run could not perform without real traffic" }
    RouteDialResult:
      type: object
      required: [ok, connect_ms]
      properties:
        ok: { type: boolean }
        connect_ms: { type: integer, format: int64, description: "Time to connect in milliseconds; 0 when it never connected" }
        answered: { type: boolean, description: The destination sent the first bytes }
        unconfirmed:
          type: boolean
          description: >
            OK through a tunnel or proxy with nothing back to say the destination
            was reached: no tunnel or proxy reports how its far end's own connect
            went, and a far end still trying looks the same. Never set for a
            direct connect, which is the destination accepting.
        error: { type: string }
    RouteTestResult:
      type: object
      required: [steps, action, rule_index, destination]
      properties:
        steps: { type: array, items: { $ref: "#/components/schemas/RouteTestStep" } }
        action: { type: string, description: "How the walk ended: route, reject, hijack-dns, bypass, or final (no rule ended it)" }
        rule_index: { type: integer, description: "-1 for the final outbound" }
        rule: { type: string }
        outbound: { type: string }
        outbound_type: { type: string }
        destination: { type: string, description: "Where the connection goes after any override_address / override_port" }
        error: { type: string, description: What the router itself would refuse the connection with }
        dial: { $ref: "#/components/schemas/RouteDialResult" }
    RuleSetTestRequest:
      type: object
      required: [address]
      properties:
        tags: { type: array, items: { type: string }, description: "Empty: every rule set the node's route declares" }
        address: { type: string }
        port: { type: integer, minimum: 0, maximum: 65535 }
    RuleSetTestResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [tag, loaded, matched]
            properties:
              tag: { type: string }
              loaded: { type: boolean }
              matched: { type: boolean }
    CheckOutboundRow:
      type: object
      required: [tag, kind]
      properties:
        tag: { type: string }
        type: { type: string, description: "The panel's type for the tag; absent when the panel has no record of it" }
        kind: { type: string, enum: [outbound, endpoint] }
    OutboundCheckResult:
      type: object
      properties:
        ok: { type: boolean }
        delay: { type: integer, description: "Latency in milliseconds" }
        error: { type: string }
    ServerInfo:
      type: object
      properties:
        core_version: { type: string }
        node_version: { type: string }
        uptime: { type: integer, format: int64 }
        num_goroutine: { type: integer }
        arch: { type: string, description: "GOARCH of the node build (amd64, arm64, …); empty from nodes older than this field" }
        setup: { type: string, description: "How the node is deployed: the container runtime (docker, podman, containerd, kubepods, lxc) or the host OS (linux) for a plain install" }
        num_cpu: { type: integer }
        mem_alloc: { type: integer, format: int64 }
        mem_sys: { type: integer, format: int64 }
        sys_mem_total: { type: integer, format: int64 }
        sys_mem_used: { type: integer, format: int64 }
        load_avg_1: { type: number }
        load_avg_5: { type: number, description: "5-minute load average; 0 from nodes older than the field or platforms that do not report one" }
        load_avg_15: { type: number, description: "15-minute load average; 0 as above" }
        sys_swap_total: { type: integer, format: int64, description: "Host swap in bytes; 0 for a host with no swap as well as when unknown" }
        sys_swap_used: { type: integer, format: int64 }
        disk_total: { type: integer, format: int64, description: "Size of the node's root filesystem in bytes; 0 when unknown" }
        disk_used: { type: integer, format: int64, description: "Used bytes of the root filesystem, counting root-reserved blocks (as df does)" }
        host_uptime: { type: integer, format: int64, description: "Seconds since the host booted — the machine's uptime, where `uptime` is the engine's" }
    PanelAddress:
      type: object
      description: >
        Where a panel process answers, in the parts a browser needs to rebuild
        its own URL. `port` is the one bound, which a reverse proxy in front
        may hide; `domain` is empty when no panel domain restricts the host.
      required: [scheme, port, domain, basepath]
      properties:
        scheme: { type: string, enum: [http, https] }
        port: { type: string }
        domain: { type: string }
        basepath: { type: string, description: "`/prefix`, or empty at the root" }
    PanelInfo:
      type: object
      description: The panel's own health readout, for the dashboard's Panel tiles.
      properties:
        version: { type: string }
        go_version: { type: string }
        uptime: { type: integer, format: int64, description: Seconds since the panel process started }
        arch: { type: string, description: "GOARCH of the panel build (amd64, arm64, …)" }
        setup: { type: string, description: "How the panel is deployed: the container runtime (docker, podman, …) or the host OS (linux) for a plain install" }
        num_cpu: { type: integer }
        num_goroutine: { type: integer }
        mem_alloc: { type: integer, format: int64 }
        mem_sys: { type: integer, format: int64 }
        sys_mem_total: { type: integer, format: int64 }
        sys_mem_used: { type: integer, format: int64 }
        load_avg_1: { type: number }
        disk_total: { type: integer, format: int64, description: Size of the root filesystem in bytes; 0 where the platform does not report one }
        disk_used: { type: integer, format: int64, description: Used bytes of the root filesystem, counting root-reserved blocks (as df does) }
        db_driver: { type: string, description: "sqlite or postgres" }
        db_size: { type: integer, format: int64, description: On-disk database size in bytes; 0 when the backend does not report one }
        db_usage_rows: { type: integer, format: int64, description: Rows in node_client_usages, the table that grows with traffic accounting }
        backup_last_at: { type: integer, format: int64, description: "Unix seconds of the newest archive the panel's own machinery counts, 0 = never. A directory that quietly stopped filling up is the failure scheduled backups have, and nothing else on the panel would show it. Sudo only — see below." }
        backup_count: { type: integer, description: "How many such archives there are. Pre-restore snapshots are excluded (they are copies of a replaced database, not evidence of a backup), as is anything stamped more than an hour ahead of now, which retention and the timer also step over — so this is the set retention actually bounds. Sudo only." }
        backup_enabled: { type: boolean, description: Whether scheduled backups are on (sudo only) }
        backup_interval_hours: { type: integer, description: "How often the schedule runs, so a client can say whether the last backup is late rather than assuming a daily one (sudo only). All four fields are 0/false for anyone else — including a token without `backup:read`, since every backup route demands that scope — so a client that cannot see them must not read them as \"never backed up\"." }
        update:
          allOf: [{ $ref: "#/components/schemas/PanelUpdateStatus" }]
          description: "The release check and the install method (sudo only; absent for everyone else). The banner is drawn from this, so it rides the poll the dashboard already makes."
    PanelUpdateStatus:
      type: object
      description: >
        What the daily release check last saw, and how this panel was installed.
        The two halves are separate questions: whether a newer release exists,
        and whether this install can replace itself with it.
      properties:
        current: { type: string, description: The version this binary was built as }
        latest: { type: string, description: "The newest release tag the check has seen; empty until the first successful check" }
        notes: { type: string, description: Link to that release on the public panel repository }
        checkedAt: { type: integer, format: int64, description: "Unix seconds of the last check, successful or not — a failure is stamped too, because the stamp is what paces the retry" }
        available: { type: boolean, description: latest is newer than current }
        checkEnabled: { type: boolean, description: "The update_check setting; false means the panel asks nothing on its own and the figures above are whatever the last check left" }
        error: { type: string, description: "Why the last check failed, or absent. An install with nothing outbound shows a reason here rather than logging one every day" }
        method: { type: string, enum: [systemd, container, manual], description: "How this panel was installed. Only a systemd install can replace itself" }
        runtime: { type: string, description: "The container runtime, when method is container" }
        unit: { type: string, description: "The systemd unit this process runs under, read from its own cgroup" }
        binary: { type: string, description: The running executable, which is the file an update replaces }
        reason: { type: string, description: "Why this panel may not update itself, in prose for the operator; absent exactly when it may" }
        canUpdate: { type: boolean }
        addonUpdates: { type: integer, description: "How many registered addons the addon directory lists a newer version of" }
        nodeLatest: { type: string, description: "The newest node release tag the check has seen; empty until the first successful check. Learned by the same check as the panel's, on its own record" }
        nodeNotes: { type: string, description: "Link to that release on the public node repository" }
        nodeError: { type: string, description: "Why the last node lookup failed, or absent; separate from `error` so one stream failing blanks nothing the other learned" }
        nodesBehind: { type: integer, description: "How many nodes report a version older than nodeLatest; a node that has not reported one is not counted" }
        nodeCache:
          type: array
          description: The node binaries this panel holds for installers, one per architecture
          items:
            type: object
            properties:
              arch: { type: string }
              version: { type: string, description: "Empty when the panel cannot tell" }
              current: { type: boolean, description: "It is nodeLatest" }
        nodeCacheCurrent: { type: boolean, description: "Every architecture the fleet needs is cached at nodeLatest. When false, an install downloads the newest node from GitHub instead of uploading the older cached one" }
    PanelUpdateJob:
      type: object
      description: >
        One upgrade. The record lives in a file beside the binary rather than in
        the database, because the panel exits in the middle of it: the rollback
        watchdog and the new process both read it, and the watchdog must not
        open a database the new build may have migrated.
      properties:
        id: { type: string }
        from: { type: string }
        to: { type: string }
        phase:
          type: string
          enum: [backup, download, verify, swap, restarting, done, error, rolled_back]
          description: "Anything but done, error and rolled_back means the job is still moving"
        message: { type: string }
        error: { type: string }
        backup: { type: string, description: "The archive taken before anything was touched — the way back from a migration, since migrations are forward-only" }
        previous: { type: string, description: Where the replaced binary is kept }
        actor: { type: string }
        startedAt: { type: integer, format: int64 }
        finishedAt: { type: integer, format: int64 }
    PanelUpdate:
      type: object
      properties:
        status: { $ref: "#/components/schemas/PanelUpdateStatus" }
        job: { $ref: "#/components/schemas/PanelUpdateJob" }
        log:
          type: array
          items: { type: string }
          description: "The job log, tail-capped. It is a file, so a browser that reconnects after the panel restarted still reads the whole run"
