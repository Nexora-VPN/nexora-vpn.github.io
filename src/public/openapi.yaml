        automaticReason: { type: string, description: Why not, when it may not }
        local: { type: boolean, description: "The panel may also install it on its own server with no SSH: automatic, and the panel runs on Linux directly (not in a container) as root" }
        localReason: { type: string, description: "Why not on its own server, when it may not" }
    AddonSSH:
      type: object
