        source: { type: string, enum: [upload, host], description: "upload (default): the panel brings the release binary, checked against SHA256SUMS; host: the install script fetches it" }
        local: { type: boolean, description: "Install on the panel's own server: the panel runs the install itself, with no SSH; the other fields are unused. On an update, moves an addon installed over SSH on this very machine to a local install" }
